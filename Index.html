<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI工作站 - 提示詞庫</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Google Fonts: Noto Sans TC -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Noto Sans TC"', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#f5f3ff',
              100: '#ede9fe',
              500: '#8b5cf6',
              600: '#7c3aed',
              700: '#6d28d9',
            },
            accent: {
              400: '#f472b6',
              500: '#ec4899',
            }
          }
        }
      }
    }
  </script>

  <style>
    /* Custom scrollbar for prompt cards */
    .custom-scrollbar::-webkit-scrollbar {
      width: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: #f1f1f1;
      border-radius: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }
  </style>
</head>
<body class="bg-[#f4f5f9] text-gray-800 font-sans min-h-screen pb-12 antialiased selection:bg-purple-100 selection:text-purple-700">

  <!-- Top Navigation Header -->
  <header class="bg-white border-b border-gray-100 sticky top-0 z-30 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      
      <!-- Brand Logo -->
      <div class="flex items-center gap-2">
        <span class="text-2xl">🚀</span>
        <h1 class="text-xl font-bold bg-gradient-to-r from-purple-700 to-indigo-600 bg-clip-text text-transparent">
          AI工作站
        </h1>
      </div>

      <!-- Navigation Tabs -->
      <nav class="hidden md:flex items-center gap-2 bg-gray-100/80 p-1 rounded-2xl border border-gray-200/60">
        <button class="nav-tab active flex items-center gap-2 px-4 py-2 rounded-xl text-sm font-semibold transition-all duration-200 bg-brand-600 text-white shadow-sm" data-tab="single">
          <i class="fa-regular fa-folder-closed"></i>
          單項提示詞
        </button>
        <button class="nav-tab flex items-center gap-2 px-4 py-2 rounded-xl text-sm font-medium text-gray-600 hover:text-gray-900 hover:bg-gray-200/50 transition-all duration-200" data-tab="flow">
          <i class="fa-solid fa-bolt text-amber-500"></i>
          流程提示詞
        </button>
        <button class="nav-tab flex items-center gap-2 px-4 py-2 rounded-xl text-sm font-medium text-gray-600 hover:text-gray-900 hover:bg-gray-200/50 transition-all duration-200" data-tab="files">
          <i class="fa-solid fa-folder-minus"></i>
          工作流檔案
        </button>
      </nav>

      <!-- Sync Status & Sheet Reload Button -->
      <div class="flex items-center gap-2">
        <button id="syncBtn" onclick="fetchGoogleSheetData()" class="flex items-center gap-1.5 text-xs text-purple-700 bg-purple-50 hover:bg-purple-100 border border-purple-200 px-3 py-1.5 rounded-xl transition font-medium">
          <i id="syncIcon" class="fa-solid fa-rotate text-purple-600"></i>
          <span id="syncStatus">同步 Sheet 資料</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-6 space-y-5">

    <!-- Search Bar Input -->
    <div class="bg-white rounded-2xl p-2.5 border border-gray-100 shadow-sm flex items-center gap-3">
      <div class="pl-3 text-gray-400">
        <i class="fa-solid fa-magnifying-glass text-lg"></i>
      </div>
      <input 
        type="text" 
        id="searchInput"
        placeholder="搜尋提示詞名稱、任務或內容關鍵字..." 
        class="w-full bg-transparent border-none text-gray-700 placeholder-gray-400 focus:outline-none text-base py-1.5"
        oninput="handleFilterChange()"
      >
      <button 
        id="clearSearch"
        onclick="clearSearchInput()"
        class="hidden text-gray-400 hover:text-gray-600 px-2"
        title="清除搜尋"
      >
        <i class="fa-solid fa-xmark"></i>
      </button>
    </div>

    <!-- Filter Control Board -->
    <div class="bg-white rounded-2xl p-5 border border-gray-100 shadow-sm space-y-4">
      
      <!-- 主軸 Filter -->
      <div class="flex flex-col sm:flex-row sm:items-center gap-2 sm:gap-4">
        <span class="text-sm font-medium text-gray-400 w-16 shrink-0">主軸</span>
        <div class="flex flex-wrap gap-2 items-center" id="categoryFilterGroup">
          <!-- Dynamically generated category pills -->
        </div>
      </div>

      <hr class="border-gray-100">

      <!-- 模式 Filter -->
      <div class="flex flex-col sm:flex-row sm:items-center gap-2 sm:gap-4">
        <span class="text-sm font-medium text-gray-400 w-16 shrink-0">模式</span>
        <div class="flex flex-wrap gap-2 items-center" id="modeFilterGroup">
          <!-- Dynamically generated mode pills -->
        </div>
      </div>

      <hr class="border-gray-100">

      <!-- AI工具 Filter -->
      <div class="flex flex-col sm:flex-row sm:items-center gap-2 sm:gap-4">
        <span class="text-sm font-medium text-gray-400 w-16 shrink-0">AI工具</span>
        <div class="flex flex-wrap gap-2 items-center" id="toolFilterGroup">
          <!-- Dynamically generated AI Tool pills -->
        </div>
      </div>

    </div>

    <!-- Prompt Items Counter -->
    <div class="flex items-center justify-between pt-1 px-1">
      <p class="text-sm font-semibold text-purple-900/70" id="promptCount">
        共 <span class="text-purple-700 font-bold" id="countNumber">0</span> 個提示詞
      </p>
      
      <!-- View mode toggle or indicator -->
      <div class="text-xs text-gray-400">
        <i class="fa-regular fa-clock mr-1"></i>實時更新
      </div>
    </div>

    <!-- Cards Grid -->
    <div id="cardsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-5">
      <!-- Cards rendered here via JS -->
    </div>

    <!-- Loading Placeholder -->
    <div id="loadingSpinner" class="hidden py-16 text-center">
      <div class="inline-block animate-spin rounded-full h-10 w-10 border-4 border-purple-500 border-t-transparent"></div>
      <p class="mt-3 text-sm text-gray-500 font-medium">正在讀取 Google Sheet 資料...</p>
    </div>

    <!-- Empty State -->
    <div id="emptyState" class="hidden bg-white rounded-2xl p-12 text-center border border-gray-100 shadow-sm">
      <div class="text-4xl mb-3">🔍</div>
      <h3 class="text-lg font-bold text-gray-700 mb-1">未找到符合條件的提示詞</h3>
      <p class="text-sm text-gray-400 mb-4">請嘗試更換搜尋關鍵字或調整篩選條件</p>
      <button onclick="resetAllFilters()" class="text-sm bg-purple-100 hover:bg-purple-200 text-purple-700 px-4 py-2 rounded-xl font-medium transition">
        重置所有篩選
      </button>
    </div>

  </main>

  <!-- Prompt Detail / Edit Modal -->
  <div id="promptModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center p-4 opacity-0 pointer-events-none transition-opacity duration-200">
    <div class="bg-white rounded-2xl max-w-2xl w-full max-h-[90vh] flex flex-col shadow-2xl overflow-hidden transform scale-95 transition-transform duration-200" id="modalContainer">
      
      <!-- Modal Header -->
      <div class="p-5 border-b border-gray-100 flex items-center justify-between bg-gray-50/50">
        <div>
          <div id="modalCategory" class="text-xs text-gray-400 font-medium"></div>
          <h2 id="modalTitle" class="text-xl font-bold text-gray-800"></h2>
        </div>
        <button onclick="closeModal()" class="w-8 h-8 rounded-full bg-gray-200/60 text-gray-500 hover:bg-gray-200 hover:text-gray-800 flex items-center justify-center transition">
          <i class="fa-solid fa-xmark text-lg"></i>
        </button>
      </div>

      <!-- Modal Tags -->
      <div id="modalTags" class="px-5 py-3 border-b border-gray-100 flex flex-wrap gap-1.5 bg-white"></div>

      <!-- Modal Body Text -->
      <div class="p-5 overflow-y-auto flex-1 custom-scrollbar">
        <label class="block text-xs font-semibold text-gray-400 mb-2">提示詞全文內容：</label>
        <textarea id="modalContent" rows="12" class="w-full p-4 border border-gray-200 rounded-xl bg-gray-50 text-gray-700 text-sm leading-relaxed focus:ring-2 focus:ring-purple-500 focus:outline-none font-sans whitespace-pre-wrap"></textarea>
      </div>

      <!-- Modal Footer -->
      <div class="p-4 border-t border-gray-100 bg-gray-50/50 flex items-center justify-end gap-3">
        <button onclick="closeModal()" class="px-4 py-2 text-sm font-medium text-gray-600 hover:bg-gray-200/60 rounded-xl transition">
          關閉
        </button>
        <button id="modalCopyBtn" onclick="copyModalPrompt()" class="px-5 py-2 text-sm font-medium bg-brand-600 hover:bg-brand-700 text-white rounded-xl shadow-sm flex items-center gap-2 transition">
          <i class="fa-regular fa-copy"></i> 複製 Prompt
        </button>
      </div>

    </div>
  </div>

  <!-- Toast Notification -->
  <div id="toast" class="fixed bottom-6 right-6 bg-gray-900 text-white px-4 py-3 rounded-xl shadow-lg flex items-center gap-3 transform translate-y-10 opacity-0 transition-all duration-300 z-50 pointer-events-none">
    <div class="w-7 h-7 bg-green-500/20 text-green-400 rounded-lg flex items-center justify-center">
      <i class="fa-solid fa-check text-sm"></i>
    </div>
    <span id="toastMsg" class="text-sm font-medium">Prompt 已成功複製到剪貼簿！</span>
  </div>

  <script>
    // ==========================================
    // DATA STATE & CONSTANTS
    // ==========================================
    const GOOGLE_SHEET_URL = 'https://docs.google.com/spreadsheets/d/1Zop57envd5v0yM0Nv6MGN7XhVx4meEACHY9lfpr-xH8/gviz/tq?tqx=out:json&gid=1480282197';
    const GOOGLE_SHEET_EDIT_URL = 'https://docs.google.com/spreadsheets/d/1Zop57envd5v0yM0Nv6MGN7XhVx4meEACHY9lfpr-xH8/edit?gid=1480282197#gid=1480282197';

    // Default Fallback Data matching screenshot exactly
    const FALLBACK_PROMPTS = [
      {
        id: '049',
        title: '049-線上課程',
        subtitle: '筆記整理',
        mainCategory: '筆記',
        mode: 'AI 助理',
        tools: ['ChatGPT', 'Gemini AI'],
        content: `【角色設定】\n你是一位專精於「學習科學」與「知識管理」的 AI 助教。擅長將混亂的課程投影片（截圖 PDF）轉化為具備邏輯、易於日後複習的高價值筆記。\n\n【任務目標】\n請分析我上傳的 PDF 檔案（由線上課程截圖組成），執行 OCR 文字辨識並進行深度萃取。請針對每一組邏輯相關的內容，自動判斷最適合的整理格式：\n\n觀念/理論型內容：使用「黃金圈法則 (Why/How/What)」解析。`
      },
      {
        id: '050',
        title: '050-線上課程',
        subtitle: '筆記整理',
        mainCategory: '筆記',
        mode: 'AI 助理',
        tools: ['ChatGPT', 'Gemini AI'],
        content: `【角色設定】\n你是一位專精於「學習科學」與「知識管理」的 AI 助教。擅長將混亂的課程投影片（截圖 PDF）轉化為具備邏輯、易於日後複習的高價值筆記。\n\n【任務目標】\n請分析我上傳的 PDF 檔案（由線上課程截圖組成），進行文字辨識與整理。請針對內容，自動判斷最適合的整理格式。\n\n並於最後一段，擷取職場可以應用的三個重點，以條列式來呈現。`
      },
      {
        id: '051',
        title: '051-長篇文章',
        subtitle: '筆記精煉',
        mainCategory: '筆記',
        mode: 'AI 協做',
        tools: ['ChatGPT', 'Gemini AI'],
        content: `為這一篇長篇文章，進行以下三個步驟，每一個步驟都要提供給文章與標示出來：\n第1、請為這篇長文生成一份體短摘要。\n第2、請基於上一個摘要，不要遺漏任何有名詞、數字或關鍵人物，重新生成一份摘要。\n第3、現在，請將摘要中每一句話都濃縮成更簡潔的表達，同時保留所有事實，讓它讀起來更像新聞標題。\n第4、最後，請確保摘要能獨立解釋所有提到的概念，不需參照原文。\n### 長文如下：`
      },
      {
        id: '052',
        title: '052-提取練習',
        subtitle: '筆記精煉',
        mainCategory: '筆記',
        mode: 'AI 協思',
        tools: ['ChatGPT', 'Gemini AI', 'Claude AI'],
        content: `我閱讀完了關於 [填入具體段落標題] 的內容。現在請幫我進行深度研磨：\n\n1-底層邏輯拷問：針對這段內容的「運作原理」向我提問，測試我是否理解了「為什麼有效」，而非只是記住步驟。\n\n2-隱喻轉化：如果這段概念有複雜的故事，請幫我將其轉化為一個 50 字以內的「關鍵隱喻」或「原則案例」。\n\n3-邏輯連動：這段內容與附件中之前的 [填入章...`
      }
    ];

    // Main Master Options for Filters
    const CATEGORIES = ['全部', '寫作', '心圖', '示範', '校正', '秘訣', '程式', '筆記', '貼文', '整理', '簡報'];
    const MODES = ['全部', 'AI 助理', 'AI 協做', 'AI 協思'];
    const TOOLS = ['全部', 'ChatGPT', 'Gemini Canvas', 'NotebookLM', 'Gemini AI', 'Claude AI'];

    // Active Selection States
    let promptsData = [...FALLBACK_PROMPTS];
    let selectedCategory = '筆記'; // Selected by default to match screenshot
    let selectedMode = '全部';
    let selectedTool = '全部';

    window.addEventListener('DOMContentLoaded', () => {
      renderFilterButtons();
      fetchGoogleSheetData();
    });

    // Fetch Google Sheet GViz Data
    async function fetchGoogleSheetData() {
      const syncBtn = document.getElementById('syncBtn');
      const syncIcon = document.getElementById('syncIcon');
      const syncStatus = document.getElementById('syncStatus');

      syncIcon.classList.add('fa-spin');
      syncStatus.innerText = '讀取中...';

      try {
        const response = await fetch(GOOGLE_SHEET_URL);
        const text = await response.text();

        // Extract JSON from Google Viz response wrappers: /*O_o*/ google.visualization.Query.setResponse({...});
        const jsonMatch = text.match(/google\.visualization\.Query\.setResponse\(([\s\S]*)\);/);
        
        if (jsonMatch && jsonMatch[1]) {
          const parsedData = JSON.parse(jsonMatch[1]);
          const rows = parsedData.table.rows;

          if (rows && rows.length > 0) {
            const loadedPrompts = [];

            rows.forEach((row, idx) => {
              const cells = row.c || [];
              const getVal = (i) => (cells[i] && cells[i].v !== null) ? String(cells[i].v).trim() : '';

              // Expected column mapping or flexible dynamic extraction
              const title = getVal(0) || getVal(1) || `Prompt ${idx + 1}`;
              const content = getVal(3) || getVal(2) || getVal(1) || '';
              const category = getVal(4) || '筆記';
              const mode = getVal(5) || 'AI 助理';
              const toolStr = getVal(6) || 'ChatGPT,Gemini AI';
              const subtitle = getVal(2) || '筆記整理';

              if (title && content) {
                loadedPrompts.push({
                  id: `sheet-${idx}`,
                  title: title,
                  subtitle: subtitle,
                  mainCategory: category,
                  mode: mode,
                  tools: toolStr.split(/[,，\s]+/).filter(Boolean),
                  content: content
                });
              }
            });

            if (loadedPrompts.length > 0) {
              promptsData = loadedPrompts;
              syncStatus.innerText = '已與 Sheet 同步';
              showToast('成功從 Google Sheet 載入最新提示詞！');
            } else {
              useFallback('Sheet 數據格式為空');
            }
          } else {
            useFallback('Sheet 無資料');
          }
        } else {
          useFallback('解析失敗');
        }
      } catch (err) {
        console.warn('Google Sheet fetch error or CORS block, using demo data:', err);
        useFallback('使用預設範例資料');
      } finally {
        syncIcon.classList.remove('fa-spin');
        renderCards();
      }
    }

    function useFallback(reason) {
      promptsData = [...FALLBACK_PROMPTS];
      const syncStatus = document.getElementById('syncStatus');
      syncStatus.innerText = '預設模式';
    }

    // Render Filters
    function renderFilterButtons() {
      // 1. Categories
      const catContainer = document.getElementById('categoryFilterGroup');
      catContainer.innerHTML = CATEGORIES.map(cat => {
        const isActive = cat === selectedCategory;
        return `
          <button 
            onclick="setCategory('${cat}')"
            class="px-3.5 py-1.5 rounded-full text-xs font-medium transition-all duration-150 ${
              isActive 
                ? 'bg-purple-100 text-purple-700 border border-purple-300 font-semibold shadow-xs' 
                : 'bg-gray-100 hover:bg-gray-200 text-gray-600 border border-transparent'
            }">
            ${cat}
          </button>
        `;
      }).join('');

      // 2. Modes
      const modeContainer = document.getElementById('modeFilterGroup');
      modeContainer.innerHTML = MODES.map(m => {
        const isActive = m === selectedMode;
        return `
          <button 
            onclick="setMode('${m}')"
            class="px-3.5 py-1.5 rounded-full text-xs font-medium transition-all duration-150 ${
              isActive 
                ? 'bg-gray-900 text-white shadow-xs' 
                : 'bg-gray-100 hover:bg-gray-200 text-gray-600 border border-transparent'
            }">
            ${m}
          </button>
        `;
      }).join('');

      // 3. AI Tools
      const toolContainer = document.getElementById('toolFilterGroup');
      toolContainer.innerHTML = TOOLS.map(t => {
        const isActive = t === selectedTool;
        return `
          <button 
            onclick="setTool('${t}')"
            class="px-3.5 py-1.5 rounded-full text-xs font-medium transition-all duration-150 ${
              isActive 
                ? 'bg-purple-100 text-purple-700 border border-purple-300 font-semibold shadow-xs' 
                : 'bg-gray-100 hover:bg-gray-200 text-gray-600 border border-transparent'
            }">
            ${t}
          </button>
        `;
      }).join('');
    }

    // Filter Selection Handlers
    function setCategory(cat) {
      selectedCategory = cat;
      renderFilterButtons();
      renderCards();
    }

    function setMode(mode) {
      selectedMode = mode;
      renderFilterButtons();
      renderCards();
    }

    function setTool(tool) {
      selectedTool = tool;
      renderFilterButtons();
      renderCards();
    }

    function handleFilterChange() {
      const searchVal = document.getElementById('searchInput').value;
      const clearBtn = document.getElementById('clearSearch');
      if (searchVal.length > 0) {
        clearBtn.classList.remove('hidden');
      } else {
        clearBtn.classList.add('hidden');
      }
      renderCards();
    }

    function clearSearchInput() {
      document.getElementById('searchInput').value = '';
      document.getElementById('clearSearch').classList.add('hidden');
      renderCards();
    }

    function resetAllFilters() {
      selectedCategory = '全部';
      selectedMode = '全部';
      selectedTool = '全部';
      document.getElementById('searchInput').value = '';
      document.getElementById('clearSearch').classList.add('hidden');
      renderFilterButtons();
      renderCards();
    }

    // Main Cards Renderer
    function renderCards() {
      const grid = document.getElementById('cardsGrid');
      const emptyState = document.getElementById('emptyState');
      const searchKeyword = document.getElementById('searchInput').value.trim().toLowerCase();

      // Filter Logic
      const filtered = promptsData.filter(item => {
        // Category Filter
        if (selectedCategory !== '全部' && item.mainCategory !== selectedCategory) {
          return false;
        }
        // Mode Filter
        if (selectedMode !== '全部' && item.mode !== selectedMode) {
          return false;
        }
        // Tool Filter
        if (selectedTool !== '全部' && (!item.tools || !item.tools.includes(selectedTool))) {
          return false;
        }
        // Search Keyword
        if (searchKeyword) {
          const titleMatch = item.title.toLowerCase().includes(searchKeyword);
          const contentMatch = item.content.toLowerCase().includes(searchKeyword);
          const subMatch = (item.subtitle || '').toLowerCase().includes(searchKeyword);
          return titleMatch || contentMatch || subMatch;
        }
        return true;
      });

      // Update Counter
      document.getElementById('countNumber').innerText = filtered.length;

      if (filtered.length === 0) {
        grid.classList.add('hidden');
        emptyState.classList.remove('hidden');
        return;
      }

      emptyState.classList.add('hidden');
      grid.classList.remove('hidden');

      grid.innerHTML = filtered.map(item => {
        // Construct tag pills
        const tagsHtml = [
          `<span class="bg-gray-100 text-gray-600 px-2.5 py-0.5 rounded-full text-xs font-medium">${item.mainCategory}</span>`,
          `<span class="bg-purple-100 text-purple-700 px-2.5 py-0.5 rounded-full text-xs font-medium">${item.mode}</span>`,
          ...(item.tools || []).map(tool => 
            `<span class="bg-indigo-50 text-indigo-600 px-2.5 py-0.5 rounded-full text-xs font-medium">${tool}</span>`
          )
        ].join('');

        return `
          <div class="bg-white rounded-2xl border border-gray-100 shadow-sm hover:shadow-md transition-all duration-200 flex flex-col overflow-hidden relative border-t-4 border-t-pink-400 group">
            
            <!-- Card Body -->
            <div class="p-5 flex-1 flex flex-col cursor-pointer" onclick='openModal(${JSON.stringify(item)})'>
              
              <!-- Tags Header -->
              <div class="flex flex-wrap gap-1.5 mb-3">
                ${tagsHtml}
              </div>

              <!-- Subtitle & Main Title -->
              <div class="text-xs text-gray-400 font-medium mb-0.5">${item.subtitle || '提示詞分類'}</div>
              <h3 class="text-lg font-bold text-gray-800 mb-3 group-hover:text-purple-700 transition-colors">
                ${item.title}
              </h3>

              <!-- Prompt Text Box -->
              <div class="bg-gray-50/60 p-3.5 rounded-xl border border-gray-100 text-xs text-gray-600 leading-relaxed custom-scrollbar overflow-y-auto max-h-56 whitespace-pre-wrap font-sans flex-1 select-text">
                ${escapeHtml(item.content)}
              </div>

            </div>

            <!-- Card Bottom Actions Bar -->
            <div class="px-5 pb-5 pt-2 flex items-center gap-2">
              <button 
                onclick='copyPromptText(${JSON.stringify(item.content)})'
                class="flex-1 bg-brand-600 hover:bg-brand-700 active:scale-[0.98] text-white rounded-xl py-2.5 px-4 text-xs font-semibold shadow-xs flex items-center justify-center gap-2 transition-all">
                <i class="fa-regular fa-copy text-sm"></i>
                複製 Prompt
              </button>
              
              <a 
                href="${GOOGLE_SHEET_EDIT_URL}"
                target="_blank"
                rel="noopener noreferrer"
                class="p-2.5 border border-gray-200 hover:border-amber-300 rounded-xl text-amber-500 hover:text-amber-600 hover:bg-amber-50 active:scale-95 transition-all flex items-center justify-center"
                title="開啟 Google 試算表進行編輯">
                <i class="fa-solid fa-pencil text-sm"></i>
              </a>
            </div>

          </div>
        `;
      }).join('');
    }

    // Copy function using fallback execCommand for iframe safety
    function copyPromptText(text) {
      if (!text) return;

      const textarea = document.createElement('textarea');
      textarea.value = text;
      textarea.style.position = 'fixed';
      textarea.style.opacity = '0';
      document.body.appendChild(textarea);
      textarea.select();

      try {
        document.execCommand('copy');
        showToast('Prompt 已成功複製到剪貼簿！');
      } catch (err) {
        showToast('複製失敗，請手動複製內容');
      } finally {
        document.body.removeChild(textarea);
      }
    }

    // Modal Control
    let currentModalItem = null;

    function openModal(item) {
      currentModalItem = item;
      document.getElementById('modalCategory').innerText = item.subtitle || item.mainCategory;
      document.getElementById('modalTitle').innerText = item.title;
      document.getElementById('modalContent').value = item.content;

      // Modal tags
      const modalTags = document.getElementById('modalTags');
      modalTags.innerHTML = [
        `<span class="bg-gray-100 text-gray-600 px-2.5 py-0.5 rounded-full text-xs font-medium">${item.mainCategory}</span>`,
        `<span class="bg-purple-100 text-purple-700 px-2.5 py-0.5 rounded-full text-xs font-medium">${item.mode}</span>`,
        ...(item.tools || []).map(t => `<span class="bg-indigo-50 text-indigo-600 px-2.5 py-0.5 rounded-full text-xs font-medium">${t}</span>`)
      ].join('');

      const modal = document.getElementById('promptModal');
      const container = document.getElementById('modalContainer');

      modal.classList.remove('pointer-events-none', 'opacity-0');
      container.classList.remove('scale-95');
      container.classList.add('scale-100');
    }

    function closeModal() {
      const modal = document.getElementById('promptModal');
      const container = document.getElementById('modalContainer');

      modal.classList.add('opacity-0', 'pointer-events-none');
      container.classList.remove('scale-100');
      container.classList.add('scale-95');
    }

    function copyModalPrompt() {
      const content = document.getElementById('modalContent').value;
      copyPromptText(content);
      closeModal();
    }

    // Toast Alert
    let toastTimer;
    function showToast(message) {
      const toast = document.getElementById('toast');
      const toastMsg = document.getElementById('toastMsg');

      toastMsg.innerText = message;
      toast.classList.remove('translate-y-10', 'opacity-0', 'pointer-events-none');

      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toast.classList.add('translate-y-10', 'opacity-0', 'pointer-events-none');
      }, 2500);
    }

    // Helper HTML Escape
    function escapeHtml(str) {
      if (!str) return '';
      return str
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }
  </script>
</body>
</html>
